debug: false

# Prevent generation in selected worlds.
disabled-worlds:


# Shared generation and administration settings.
performance:
  max-structures-per-tick: 3
  auto-save-ticks: 1200
protection:
  enabled: true
structure-overlap-prevention:
  enabled: true
  radius: 10
mob-encounters:
  enabled: false
  entity: ZOMBIE
  count: 2
  glowing: false
difficulty-scaling:
  base-multiplier: 1.0
  distance-step: 1000.0
  distance-factor: 0.1

